name: Deploy ec-search-api to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t asia-northeast1-docker.pkg.dev/ec-price-search/searxng-repo/ec-search-api:${{ github.sha }} .
          docker push asia-northeast1-docker.pkg.dev/ec-price-search/searxng-repo/ec-search-api:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ec-search-api
          region: asia-northeast1
          project_id: ec-price-search
          image: asia-northeast1-docker.pkg.dev/ec-price-search/searxng-repo/ec-search-api:${{ github.sha }}
          flags: '--allow-unauthenticated'
